name: Deploy Theme
on:
  push:
    branches:
      - master
      - main
permissions:
  contents: write
concurrency:
  group: deploy-theme
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Bump patch version (unless already bumped manually)
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          current=$(node -p "require('./package.json').version")
          previous=""
          if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            previous=$(git show "$BEFORE:package.json" | node -p "JSON.parse(require('fs').readFileSync(0)).version")
          fi
          if [ -n "$previous" ] && [ "$current" != "$previous" ]; then
            echo "Version already bumped manually ($previous -> $current), skipping."
          else
            npm version patch --no-git-tag-version
          fi

      - uses: pnpm/action-setup@v6.1.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26.13.1
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and zip theme
        run: pnpm zip

      - name: Check theme with gscan
        run: pnpm test

      - name: Commit version bump
        run: |
          git add package.json
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          version=$(node -p "require('./package.json').version")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Release $version [skip ci]"
          git push origin HEAD:${{ github.ref_name }}

      - name: Deploy Ghost Theme
        uses: TryGhost/action-deploy-theme@v2.0.4
        with:
          api-url: ${{ secrets.GHOST_ADMIN_API_URL }}
          api-key: ${{ secrets.GHOST_ADMIN_API_KEY }}
          file: dist/ai-blog-theme.zip
